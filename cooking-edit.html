<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">    <title>Cooking Pictures</title>
    <link rel="icon" type="image/x-icon" href="imgs/favicon.png">
    <link rel="stylesheet" href="cooking-edit.css">
</head>
<script src="https://cdn.jsdelivr.net/npm/cos-js-sdk-v5/dist/cos-js-sdk-v5.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pikaday/css/pikaday.css"/>
<body>
<div class="container">
    <header>
        <h1>Cooking图片管理</h1>
    </header>
    <div class="auth-form-group" id="cosIdContainer">
        <label for="cosId">图片访问ID</label>
        <input type="password" id="cosId" placeholder="请输入...">
    </div>
    <div class="auth-form-group" id="cosTokenContainer">
        <label for="cosToken">图片访问令牌</label>
        <input type="password" id="cosToken" placeholder="请输入...">
    </div>

    <div class="actions">
        <button class="btn btn-primary" id="addImageBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="1rem" height="1rem" fill="currentColor" viewBox="0 0 16 6">
                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
            </svg>
            添加图片
        </button>
        <input type="file" id="fileInput" class="file-input" accept="image/*" multiple>
        <button class="btn btn-secondary" id="saveBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="1rem" height="1rem" fill="currentColor" viewBox="0 0 16 16">
                <path d="M2 1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H9.5a1 1 0 0 0-1 1v7.293l2.646-2.647a.5.5 0 0 1 .708.708l-3.5 3.5a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L7.5 9.293V2a2 2 0 0 1 2-2H14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h2.5a.5.5 0 0 1 0 1H2z"/>
            </svg>
            保存更改
        </button>
    </div>

    <div class="drop-zone" id="dropZone">
        <p>拖拽图片到这里上传，或点击上方"添加图片"按钮</p>
    </div>

    <!-- 上传预览区域 -->
    <div class="upload-preview" id="uploadPreview">
        <h3 class="preview-title">预览上传的图片</h3>
        <div class="preview-list" id="previewList">
            <!-- 预览图片将在这里显示 -->
        </div>
        <div class="upload-actions">
            <button class="btn btn-cancel" id="cancelUpload">取消</button>
            <button class="btn btn-secondary" id="confirmUpload">确认上传</button>
        </div>
    </div>

    <div class="gallery" id="imageGallery">
        <!-- 图片卡片将通过JavaScript动态添加 -->
    </div>

    <!-- 编辑图片信息的模态框 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">编辑图片信息</h3>
            </div>
            <form id="imageForm">
                <input type="hidden" id="editIndex">
                <div class="form-group">
                    <label for="imageTitle">图片标题</label>
                    <input type="text" class="form-control" id="imageTitle" placeholder="输入图片标题">
                </div>
                <div class="form-group">
                    <label for="imageDate">图片日期</label>
                    <input type="text" id="imageDate" class="form-control" placeholder="点击选择日期" readonly>
                </div>
                <div class="form-group">
                    <label for="imageDescription">图片描述</label>
                    <textarea class="form-control" id="imageDescription" placeholder="输入图片描述" rows="5"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-cancel" id="cancelEdit">取消</button>
                    <button type="submit" class="btn btn-secondary">确定</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Loading遮罩层 -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-content">
        <div class="loading-spinner">
            <div class="spinner-circle"></div>
        </div>
        <div class="loading-text">加载中，请稍候...</div>
    </div>
</div>
<!-- 通知弹窗 -->
<div class="notification" id="notification">
    <div class="notification-icon">!</div>
    <div class="notification-content">
        <div class="notification-title" id="notificationTitle">通知标题</div>
        <div class="notification-message" id="notificationMessage">这里是通知内容</div>
    </div>
</div>
</body>
<script src="https://cdn.jsdelivr.net/npm/pikaday/pikaday.js"></script>
<script src="cooking-edit.js"></script>
</html>
